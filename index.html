<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 - Gabungkan Blok Angka</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8ef;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        color: #776e65;
        padding: 16px;
        overflow: hidden;
        user-select: none;
    }

    .game-container {
        width: 100%;
        max-width: 480px;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 12px;
    }

    .title {
        font-size: 48px;
        font-weight: 800;
        color: #776e65;
        line-height: 1;
    }

    .scores {
        display: flex;
        gap: 8px;
    }

    .score-box {
        background: #bbada0;
        color: #f9f6f2;
        border-radius: 8px;
        padding: 8px 18px;
        text-align: center;
        min-width: 80px;
    }

    .score-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.85;
    }

    .score-value {
        display: block;
        font-size: 22px;
        font-weight: 800;
        margin-top: 2px;
    }

    .subheader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 12px;
        flex-wrap: wrap;
    }

    .subtitle {
        font-size: 14px;
        color: #776e65;
        line-height: 1.4;
        flex: 1;
        min-width: 180px;
    }

    .subtitle strong {
        color: #776e65;
    }

    .new-game-btn {
        background: #8f7a66;
        color: #f9f6f2;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s;
        white-space: nowrap;
    }

    .new-game-btn:hover {
        background: #9f8b77;
    }

    .new-game-btn:active {
        transform: scale(0.97);
    }

    .board-wrapper {
        position: relative;
        background: #bbada0;
        border-radius: 10px;
        padding: 12px;
        touch-action: none;
    }

    .grid-background {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .grid-cell {
        background: rgba(238, 228, 218, 0.35);
        border-radius: 6px;
        aspect-ratio: 1 / 1;
    }

    .tile-container {
        position: absolute;
        inset: 12px;
        pointer-events: none;
    }

    .tile {
        position: absolute;
        width: calc((100% - 36px) / 4);
        height: calc((100% - 36px) / 4);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 32px;
        transition: transform 0.1s ease-in-out;
        will-change: transform;
    }

    .tile-inner {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        animation: appear 0.15s ease-out;
    }

    @keyframes appear {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .tile-inner.merged {
        animation: pop 0.15s ease-out;
    }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.18); }
        100% { transform: scale(1); }
    }

    .tile[data-value="2"] .tile-inner { background: #eee4da; color: #776e65; }
    .tile[data-value="4"] .tile-inner { background: #ede0c8; color: #776e65; }
    .tile[data-value="8"] .tile-inner { background: #f2b179; color: #f9f6f2; }
    .tile[data-value="16"] .tile-inner { background: #f59563; color: #f9f6f2; }
    .tile[data-value="32"] .tile-inner { background: #f67c5f; color: #f9f6f2; }
    .tile[data-value="64"] .tile-inner { background: #f65e3b; color: #f9f6f2; }
    .tile[data-value="128"] .tile-inner { background: #edcf72; color: #f9f6f2; font-size: 28px; }
    .tile[data-value="256"] .tile-inner { background: #edcc61; color: #f9f6f2; font-size: 28px; }
    .tile[data-value="512"] .tile-inner { background: #edc850; color: #f9f6f2; font-size: 28px; }
    .tile[data-value="1024"] .tile-inner { background: #edc53f; color: #f9f6f2; font-size: 22px; }
    .tile[data-value="2048"] .tile-inner { background: #edc22e; color: #f9f6f2; font-size: 22px; box-shadow: 0 0 24px rgba(237, 194, 46, 0.6); }
    .tile[data-value="4096"] .tile-inner { background: #3c3a32; color: #f9f6f2; font-size: 22px; }
    .tile[data-value="8192"] .tile-inner { background: #2e2c26; color: #f9f6f2; font-size: 22px; }

    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(238, 228, 218, 0.73);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 10;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .overlay[hidden] {
        display: none;
    }

    .overlay-title {
        font-size: 48px;
        font-weight: 800;
        color: #776e65;
    }

    .overlay-subtitle {
        font-size: 16px;
        color: #776e65;
        margin-top: -8px;
    }

    .overlay-buttons {
        display: flex;
        gap: 10px;
    }

    .overlay-btn {
        background: #8f7a66;
        color: #f9f6f2;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s;
    }

    .overlay-btn:hover {
        background: #9f8b77;
    }

    .overlay-btn.secondary {
        background: #bbada0;
    }

    .overlay-btn.secondary:hover {
        background: #c7b9ac;
    }

    .footer-hint {
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
        color: #a29a92;
    }

    @media (max-width: 480px) {
        .title { font-size: 36px; }
        .score-box { padding: 6px 12px; min-width: 66px; }
        .score-value { font-size: 18px; }
        .score-label { font-size: 10px; }
        .tile { font-size: 26px; }
        .tile[data-value="128"] .tile-inner,
        .tile[data-value="256"] .tile-inner,
        .tile[data-value="512"] .tile-inner { font-size: 22px; }
        .tile[data-value="1024"] .tile-inner,
        .tile[data-value="2048"] .tile-inner { font-size: 18px; }
        .overlay-title { font-size: 36px; }
    }
</style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1 class="title">2048</h1>
        <div class="scores">
            <div class="score-box">
                <span class="score-label">Skor</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Terbaik</span>
                <span class="score-value" id="best">0</span>
            </div>
        </div>
    </div>

    <div class="subheader">
        <p class="subtitle">
            Geser blok dengan <strong>arrow keys</strong> atau <strong>swipe</strong>. Gabungkan angka yang sama untuk mencapai <strong>2048</strong>!
        </p>
        <button class="new-game-btn" id="new-game">Game Baru</button>
    </div>

    <div class="board-wrapper" id="board-wrapper">
        <div class="grid-background">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
        </div>
        <div class="tile-container" id="tile-container"></div>

        <div class="overlay" id="overlay" hidden>
            <div class="overlay-title" id="overlay-title">Game Over</div>
            <div class="overlay-subtitle" id="overlay-subtitle">Skor akhir: 0</div>
            <div class="overlay-buttons">
                <button class="overlay-btn" id="overlay-retry">Coba Lagi</button>
                <button class="overlay-btn secondary" id="overlay-continue" hidden>Lanjutkan</button>
            </div>
        </div>
    </div>

    <p class="footer-hint">Tekan <strong>R</strong> untuk restart cepat</p>
</div>

<script>
const SIZE = 4;
const tileContainer = document.getElementById("tile-container");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlaySubtitle = document.getElementById("overlay-subtitle");
const overlayRetry = document.getElementById("overlay-retry");
const overlayContinue = document.getElementById("overlay-continue");
const newGameBtn = document.getElementById("new-game");

let grid = [];
let score = 0;
let best = Number(localStorage.getItem("best2048") || 0);
let tileIdCounter = 0;
let gameWon = false;
let keepPlaying = false;
let isAnimating = false;

bestEl.textContent = best;

function createEmptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
}

function getEmptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (!grid[r][c]) cells.push({ r, c });
        }
    }
    return cells;
}

function addRandomTile() {
    const empty = getEmptyCells();
    if (empty.length === 0) return null;
    const { r, c } = empty[Math.floor(Math.random() * empty.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = {
        id: tileIdCounter++,
        value,
        row: r,
        col: c,
        isNew: true,
        mergedFrom: null
    };
    grid[r][c] = tile;
    return tile;
}

function getTilePosition(row, col) {
    const gap = 12;
    const tilePercent = (100 - (gap * (SIZE - 1)) / 8) / SIZE;
    const colSpacing = 100 / SIZE;
    const rowSpacing = 100 / SIZE;
    const colOffset = (col * colSpacing) + (gap / 8) * (col + 1);
    const rowOffset = (row * rowSpacing) + (gap / 8) * (row + 1);
    return { x: colOffset, y: rowOffset };
}

function renderTiles() {
    tileContainer.innerHTML = "";
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const tile = grid[r][c];
            if (tile) {
                renderTile(tile);
            }
        }
    }
}

function renderTile(tile) {
    const el = document.createElement("div");
    el.className = "tile";
    el.dataset.value = tile.value;

    const pos = getTilePosition(tile.row, tile.col);
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";

    const inner = document.createElement("div");
    inner.className = "tile-inner";
    if (tile.isNew) inner.classList.add("merged");
    if (tile.mergedFrom) inner.classList.add("merged");
    inner.textContent = tile.value;
    el.appendChild(inner);

    tileContainer.appendChild(el);
    tile.el = el;
    tile.isNew = false;
    tile.mergedFrom = null;
}

function updateScore(points) {
    score += points;
    scoreEl.textContent = score;
    if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("best2048", best);
    }
}

function getLine(row, col, direction) {
    const line = [];
    if (direction === "left") {
        for (let c = 0; c < SIZE; c++) line.push(grid[row][c]);
    } else if (direction === "right") {
        for (let c = SIZE - 1; c >= 0; c--) line.push(grid[row][c]);
    } else if (direction === "up") {
        for (let r = 0; r < SIZE; r++) line.push(grid[r][col]);
    } else if (direction === "down") {
        for (let r = SIZE - 1; r >= 0; r--) line.push(grid[r][col]);
    }
    return line;
}

function setLine(row, col, direction, line) {
    if (direction === "left") {
        for (let c = 0; c < SIZE; c++) grid[row][c] = line[c];
    } else if (direction === "right") {
        for (let c = SIZE - 1, i = 0; c >= 0; c--, i++) grid[row][c] = line[i];
    } else if (direction === "up") {
        for (let r = 0; r < SIZE; r++) grid[r][col] = line[r];
    } else if (direction === "down") {
        for (let r = SIZE - 1, i = 0; r >= 0; r--, i++) grid[r][col] = line[i];
    }
}

function updateTilePosition(tile, row, col) {
    tile.row = row;
    tile.col = col;
    if (tile.el) {
        const pos = getTilePosition(row, col);
        tile.el.style.left = pos.x + "%";
        tile.el.style.top = pos.y + "%";
    }
}

function slideLine(line, row, col, direction) {
    const filtered = line.filter((t) => t !== null);
    const result = [];
    let mergedPoints = 0;
    let i = 0;

    while (i < filtered.length) {
        const current = filtered[i];
        const next = filtered[i + 1];

        if (next && current.value === next.value) {
            const newValue = current.value * 2;
            const mergedTile = {
                id: tileIdCounter++,
                value: newValue,
                row: current.row,
                col: current.col,
                mergedFrom: [current, next],
                isNew: false
            };
            result.push(mergedTile);
            mergedPoints += newValue;

            if (newValue === 2048 && !gameWon) {
                gameWon = true;
                setTimeout(() => showWin(), 200);
            }

            if (current.el) {
                current.el.remove();
            }
            if (next.el) {
                next.el.remove();
            }
            i += 2;
        } else {
            result.push(current);
            i += 1;
        }
    }

    while (result.length < SIZE) result.push(null);

    let moved = false;
    for (let k = 0; k < SIZE; k++) {
        if (line[k] !== result[k]) moved = true;
    }

    return { result, moved, mergedPoints };
}

function move(direction) {
    if (isAnimating) return false;
    if (!keepPlaying && overlay.hidden === false && !overlayContinue.hidden) return false;

    const oldGrid = grid.map((row) => row.slice());
    let moved = false;
    let totalPoints = 0;

    if (direction === "left" || direction === "right") {
        for (let r = 0; r < SIZE; r++) {
            const line = getLine(r, 0, direction);
            const { result, moved: lineMoved, mergedPoints } = slideLine(line, r, 0, direction);
            if (lineMoved) moved = true;
            totalPoints += mergedPoints;
            setLine(r, 0, direction, result);
        }
    } else {
        for (let c = 0; c < SIZE; c++) {
            const line = getLine(0, c, direction);
            const { result, moved: lineMoved, mergedPoints } = slideLine(line, 0, c, direction);
            if (lineMoved) moved = true;
            totalPoints += mergedPoints;
            setLine(0, c, direction, result);
        }
    }

    if (!moved) return false;

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const tile = grid[r][c];
            if (tile) updateTilePosition(tile, r, c);
        }
    }

    updateScore(totalPoints);
    addRandomTile();

    setTimeout(() => {
        tileContainer.innerHTML = "";
        renderTiles();
        checkGameOver();
    }, 100);

    return true;
}

function canMove() {
    if (getEmptyCells().length > 0) return true;
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const tile = grid[r][c];
            if (!tile) continue;
            if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === tile.value) return true;
            if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === tile.value) return true;
        }
    }
    return false;
}

function checkGameOver() {
    if (canMove()) return;
    setTimeout(() => {
        overlayTitle.textContent = "Game Over";
        overlaySubtitle.textContent = `Skor akhir: ${score}`;
        overlayContinue.hidden = true;
        overlay.hidden = false;
    }, 200);
}

function showWin() {
    if (keepPlaying) return;
    overlayTitle.textContent = "Kamu Menang!";
    overlaySubtitle.textContent = `Skor: ${score}`;
    overlayContinue.hidden = false;
    overlay.hidden = false;
}

function newGame() {
    grid = createEmptyGrid();
    score = 0;
    gameWon = false;
    keepPlaying = false;
    isAnimating = false;
    scoreEl.textContent = "0";
    overlay.hidden = true;
    tileContainer.innerHTML = "";
    addRandomTile();
    addRandomTile();
    renderTiles();
}

overlayContinue.addEventListener("click", () => {
    keepPlaying = true;
    overlay.hidden = true;
});

overlayRetry.addEventListener("click", () => {
    newGame();
});

newGameBtn.addEventListener("click", () => {
    newGame();
});

document.addEventListener("keydown", (event) => {
    const key = event.key;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
        event.preventDefault();
        if (key === "ArrowUp") move("up");
        else if (key === "ArrowDown") move("down");
        else if (key === "ArrowLeft") move("left");
        else if (key === "ArrowRight") move("right");
    } else if (key === "r" || key === "R") {
        newGame();
    }
});

let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;

const boardWrapper = document.getElementById("board-wrapper");

boardWrapper.addEventListener("touchstart", (event) => {
    if (event.touches.length !== 1) return;
    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
    touchMoved = false;
}, { passive: true });

boardWrapper.addEventListener("touchmove", (event) => {
    if (event.touches.length !== 1) return;
    event.preventDefault();
    const dx = event.touches[0].clientX - touchStartX;
    const dy = event.touches[0].clientY - touchStartY;
    if (touchMoved) return;
    const threshold = 24;
    if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

    touchMoved = true;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) move("right");
        else move("left");
    } else {
        if (dy > 0) move("down");
        else move("up");
    }
}, { passive: false });

boardWrapper.addEventListener("touchend", () => {
    touchMoved = false;
}, { passive: true });

newGame();
</script>
</body>
</html>
